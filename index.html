<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sales Visit</title>
    <style>
        /* Desain UI Minimalis dengan Tema Warna Khusus */
        :root {
            --primary-color: #14a07d; 
            --accent-color: #ffd44b;  
            --bg-color: #f4f7f6;      
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #ced4da;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            border-top: 6px solid var(--accent-color); 
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 140px; 
            height: auto;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 14px;
        }

        input[type="text"], select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box; 
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(20, 160, 125, 0.15); 
        }

        button { 
            padding: 14px 20px; 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 6px;
            cursor: pointer; 
            width: 100%; 
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s, color 0.3s;
        }

        button:hover { 
            background-color: var(--accent-color); 
            color: #333333; 
        }
        
        button:disabled {
            background-color: #a0aabf;
            color: white;
            cursor: not-allowed;
        }

        .checkbox-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary-color); 
        }

        #div_other_produk { 
            display: none; 
            margin-top: 10px; 
        }
        
        .status-group {
            grid-template-columns: 1fr;
        }

        /* CSS Baru untuk Label Status */
        .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 13px;
            color: var(--primary-color);
            font-weight: 600;
            display: none; 
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="logo-container">
            <!-- Ganti src di bawah ini dengan link gambar logo Anda -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQO0ka0SRvHCd4Aneee1AkR-1nWokSKLVhpuQUXoAbB16DGNj2p6D6V0-o&s=10" alt="Logo Perusahaan">
        </div>

        <h2>Kunjungan Sales</h2>
        <form id="salesForm">
            
            <div class="form-group">
                <label>Stream Line</label>
                <select id="stream_line" required>
                    <option value="">-- Pilih Stream --</option>
                    <option value="Feed for Livestock">Feed for Livestock</option>
                    <option value="Feed for Milk">Feed for Milk</option>
                    <option value="Feed for Meat">Feed for Meat</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nama Sales</label>
                <select id="nama_sales" required>
                    <option value="">-- Pilih Sales --</option>
                    <option value="Amin">Amin</option>
                    <option value="Arif">Arif</option>
                    <option value="Dodi">Dodi</option>
                    <option value="Gustira">Gustira</option>
                    <option value="Ilma">Ilma</option>
                    <option value="Laely">Laely</option>
                    <option value="Naura">Naura</option>
                    <option value="Pak Hafidz">Pak Hafidz</option>
                    <option value="Pak Ihsan">Pak Ihsan</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nama / Outlet (Cari atau tambah baru)</label>
                <input type="text" id="nama_outlet" list="outlet_list" autocomplete="off" placeholder="Ketik nama outlet..." required>
                <datalist id="outlet_list"></datalist>
                <input type="hidden" id="id_outlet"> 
                
                <!-- Label untuk menampilkan status terakhir -->
                <div id="info_status" class="status-badge">
                    Status Terakhir: <span id="text_status_terbaru">-</span>
                </div>
            </div>

            <div class="form-group">
                <label>Alamat</label>
                <input type="text" id="alamat" placeholder="Masukkan alamat lengkap..." required>
            </div>

            <div class="form-group">
                <label>No Telp</label>
                <input type="text" id="no_telp" placeholder="Contoh: 08123456789" required>
            </div>

            <div class="form-group">
                <label>Produk Offer</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" class="produk" value="Raw Material"> Raw Material</label>
                    <label><input type="checkbox" class="produk" value="Konsentrat"> Konsentrat</label>
                    <label><input type="checkbox" class="produk" value="Slice Beef"> Slice Beef</label>
                    <label><input type="checkbox" class="produk" value="Frozen Beef"> Frozen Beef</label>
                    <label><input type="checkbox" class="produk" value="Fresh Beef"> Fresh Beef</label>
                    <label><input type="checkbox" class="produk" value="Yogurt"> Yogurt</label>
                    <label><input type="checkbox" class="produk" value="Milk"> Milk</label>
                    <label><input type="checkbox" id="check_other_produk" value="Other"> Other</label>
                </div>
                <div id="div_other_produk">
                    <input type="text" id="text_other_produk" placeholder="Ketik produk lainnya...">
                </div>
            </div>

            <div class="form-group">
                <label>Status Kunjungan</label>
                <div class="checkbox-group status-group">
                    <label><input type="checkbox" class="status" value="Prospect"> Prospect</label>
                    <label><input type="checkbox" class="status" value="Contact"> Contact</label>
                    <label><input type="checkbox" class="status" value="Quotation"> Quotation</label>
                    <label><input type="checkbox" class="status" value="Sampling"> Sampling</label>
                    <label><input type="checkbox" class="status" value="Closed Won"> Closed Won</label>
                    <label><input type="checkbox" class="status" value="Closed Lost"> Closed Lost</label>
                    <label><input type="checkbox" class="status" value="Repeat Order"> Repeat Order</label>
                </div>
            </div>

            <button type="submit">Simpan Data</button>
        </form>
    </div>

    <script>
        // MASUKKAN URL WEB APP ANDA DI SINI
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyn4LLeDQ4Y6SQJwpiyyfPSwBkuqYlD7M1850AoMHxPP09JTOq6xzD1ZB2gDkRojKAfLg/exec'; 

        let masterOutlets = [];

        document.getElementById('check_other_produk').addEventListener('change', function() {
            const divOther = document.getElementById('div_other_produk');
            if(this.checked) {
                divOther.style.display = 'block';
                document.getElementById('text_other_produk').required = true;
            } else {
                divOther.style.display = 'none';
                document.getElementById('text_other_produk').required = false;
                document.getElementById('text_other_produk').value = ''; 
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            fetch(GAS_URL)
                .then(response => response.json())
                .then(data => {
                    masterOutlets = data;
                    const datalist = document.getElementById('outlet_list');
                    data.forEach(outlet => {
                        const option = document.createElement('option');
                        option.value = outlet.nama;
                        datalist.appendChild(option);
                    });
                });
        });

        document.getElementById('nama_outlet').addEventListener('input', function(e) {
            const inputName = e.target.value.toLowerCase();
            const foundOutlet = masterOutlets.find(o => o.nama.toLowerCase() === inputName);
            
            const infoStatus = document.getElementById('info_status');
            const textStatus = document.getElementById('text_status_terbaru');

            if (foundOutlet) {
                document.getElementById('alamat').value = foundOutlet.alamat;
                document.getElementById('no_telp').value = foundOutlet.no_telp;
                document.getElementById('id_outlet').value = foundOutlet.id;
                
                // Menampilkan status terbaru dari outlet yang dipilih
                let statusTerkini = foundOutlet.status_terbaru;
                textStatus.innerText = statusTerkini ? statusTerkini : 'Belum ada status';
                infoStatus.style.display = 'inline-block';
            } else {
                document.getElementById('id_outlet').value = '';
                infoStatus.style.display = 'none';
            }
        });

        document.getElementById('salesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let produkArray = Array.from(document.querySelectorAll('.produk:checked'))
                                   .filter(cb => cb.value !== 'Other') 
                                   .map(cb => cb.value);
            
            if (document.getElementById('check_other_produk').checked) {
                produkArray.push(document.getElementById('text_other_produk').value);
            }
            const produkString = produkArray.join(', ');

            const statusArray = Array.from(document.querySelectorAll('.status:checked')).map(cb => cb.value);
            const statusString = statusArray.join(', ');

            if(statusArray.length === 0) {
                alert("Harap pilih minimal 1 Status Kunjungan!");
                return;
            }

            const payload = {
                stream_line: document.getElementById('stream_line').value,
                nama_sales: document.getElementById('nama_sales').value,
                id_outlet: document.getElementById('id_outlet').value,
                nama_outlet: document.getElementById('nama_outlet').value,
                alamat: document.getElementById('alamat').value,
                no_telp: document.getElementById('no_telp').value,
                produk_offer: produkString,
                status_array: statusArray,   
                status_string: statusString  
            };

            const btnSubmit = document.querySelector('button[type="submit"]');
            btnSubmit.innerText = "Menyimpan...";
            btnSubmit.disabled = true;

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                alert('Data kunjungan berhasil disimpan!');
                document.getElementById('salesForm').reset();
                document.getElementById('id_outlet').value = '';
                document.getElementById('div_other_produk').style.display = 'none';
                document.getElementById('info_status').style.display = 'none'; // Sembunyikan badge setelah submit
            })
            .catch(error => {
                alert('Terjadi kesalahan saat menyimpan data. Periksa koneksi internet Anda.');
                console.error(error);
            })
            .finally(() => {
                btnSubmit.innerText = "Simpan Data";
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
